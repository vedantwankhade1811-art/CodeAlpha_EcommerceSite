{% extends 'base.html' %}
{% load static %}

{% block title %}Email Dispatched &mdash; Cartza{% endblock %}

{% block content %}
<div class="container section-padding">
  <div class="auth-container" style="text-align: center;">
    <h1 class="auth-title">Instructions Dispatched</h1>
    <p class="auth-subtitle" style="margin-top: 12px; line-height: 1.6;">
      We have sent instructions for setting a new password to the email address submitted (printed to developer console).
    </p>
    <div style="margin-top: 24px;">
      <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm">Return to Login</a>
    </div>
  </div>
</div>
{% endblock %}
