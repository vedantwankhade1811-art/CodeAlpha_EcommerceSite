{% extends 'base.html' %}
{% load static %}

{% block title %}Password Updated &mdash; Cartza{% endblock %}

{% block content %}
<div class="container section-padding">
  <div class="auth-container" style="text-align: center;">
    <h1 class="auth-title">Password Updated</h1>
    <p class="auth-subtitle" style="margin-top: 12px;">
      Your password has been changed successfully. You may now sign in using your new credentials.
    </p>
    <div style="margin-top: 24px;">
      <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-sm">Sign In to Cartza</a>
    </div>
  </div>
</div>
{% endblock %}
