{% extends 'base.html' %}
{% load static %}

{% block title %}404 &mdash; Page Not Found &mdash; Cartza{% endblock %}

{% block content %}
<div class="container section-padding" style="text-align: center; max-width: 600px; margin: var(--space-48) auto;">
  <div style="font-family: var(--font-heading); font-size: 72px; font-weight: 700; color: var(--grey-dark); line-height: 1;">404</div>
  <h1 style="font-size: var(--text-lg); margin: var(--space-16) 0 var(--space-8) 0;">Page Not Found</h1>
  <p style="color: var(--grey-muted); font-size: var(--text-base); margin-bottom: var(--space-32);">
    The essential or collection you are seeking does not exist, has been archived, or was relocated.
  </p>
  <div style="display: flex; gap: 16px; justify-content: center;">
    <a href="{% url 'core:home' %}" class="btn btn-primary btn-sm">Return Home</a>
    <a href="{% url 'products:shop' %}" class="btn btn-secondary btn-sm">Explore Shop</a>
  </div>
</div>
{% endblock %}
